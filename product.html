<script>
function getProductIdFromUrl(){
  let params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function buyNow(id){
  if(addC(id)){
    window.location.href = 'checkout.html';
  }
}

function renderProductPage(){
  let id = getProductIdFromUrl();
  let p = PROD.find(x => x.id == id);
  if(!p){
    document.querySelector('.container .box').innerHTML = '<p style="text-align:center;color:var(--muted)">المنتج مش موجود أو اتشال من المتجر.</p><a href="index.html" class="btn">الرجوع للمتجر</a>';
    return;
  }

  document.title = p.n + ' - ' + (SET.name || 'yourplace_مكانك');
  document.getElementById('landingTitle').innerText = p.n;
  document.getElementById('landingDesc').innerText = p.d || (LANG==='ar' ? 'لا يوجد وصف تفصيلي متوفر حالياً لهذا المنتج.' : 'No description available for this product.');

  let priceHtml = p.disc && p.disc < p.v
    ? `<span style="text-decoration:line-through;color:var(--muted);font-size:18px; margin-left:10px;">${p.v} ${i18n[LANG].currency}</span> <span style="color:var(--main); font-size:26px; font-weight:bold;">${p.disc} ${i18n[LANG].currency}</span>`
    : `<span style="color:var(--main); font-size:26px; font-weight:bold;">${p.v} ${i18n[LANG].currency}</span>`;
  document.getElementById('landingPrice').innerHTML = priceHtml;

  let mediaList = p.media && p.media.length ? p.media : [{type:'image', src:'https://via.placeholder.com/400'}];
  let mediaItemsHtml = mediaList.map((m, i) => {
    let activeClass = i === 0 ? 'active' : '';
    let priorityAttr = i === 0 ? 'fetchpriority="high"' : 'loading="lazy"';
    return m.type === 'video'
      ? `<video src="${m.src}" ${i===0?'autoplay':''} muted loop playsinline controls class="lp-item ${activeClass}" style="object-fit:contain"></video>`
      : `<img src="${m.src}" ${priorityAttr} alt="${esc(p.n)}" class="lp-item ${activeClass}" style="object-fit:contain">`;
  }).join('');
  let navHtml = mediaList.length > 1 ? `<button class="media-nav prev" onclick="slideLPMedia(-1)">&#10095;</button><button class="media-nav next" onclick="slideLPMedia(1)">&#10094;</button>` : '';
  let dotsHtml = mediaList.length > 1 ? `<div class="media-dots">${mediaList.map((m,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>` : '';
  document.getElementById('landingMedia').innerHTML = mediaItemsHtml + navHtml + dotsHtml;
  startLPAutoplay(mediaList.length);

  let buyBtn = document.getElementById('landingBuyBtn');
  buyBtn.setAttribute('onclick', `buyNow('${p.id}');`);

  let timerWrap = document.getElementById('lpTimerWrapper');
  if(SET.countDownOn) {
     timerWrap.style.display = 'block';
     document.getElementById('lpTimerText').innerText = SET.countDownText;
     startDynamicTimer('lpHours', 'lpMins', 'lpSecs');
  } else {
     timerWrap.style.display = 'none';
  }
}

// جاليري صفحة المنتج: نفس فكرة كروسفيد كروت المتجر الرئيسي، بس بمؤقت واحد
// بس لأن الصفحة فيها منتج واحد ظاهر في نفس اللحظة.
let LP_AUTOPLAY_TIMER = null;
function slideLPMedia(direction){
  let container = document.getElementById('landingMedia');
  let items = container.querySelectorAll('.lp-item');
  if(!items.length) return;
  let activeIdx = Array.from(items).findIndex(el => el.classList.contains('active'));
  items[activeIdx].classList.remove('active');
  if(items[activeIdx].tagName === 'VIDEO') items[activeIdx].pause();
  let nextIdx = activeIdx + direction;
  if(nextIdx >= items.length) nextIdx = 0;
  if(nextIdx < 0) nextIdx = items.length - 1;
  items[nextIdx].classList.add('active');
  if(items[nextIdx].tagName === 'VIDEO') items[nextIdx].play().catch(()=>{});

  let dots = container.querySelectorAll('.media-dots span');
  if(dots.length){
    dots.forEach(d => d.classList.remove('active'));
    if(dots[nextIdx]) dots[nextIdx].classList.add('active');
  }
}
function startLPAutoplay(count){
  if(LP_AUTOPLAY_TIMER) clearInterval(LP_AUTOPLAY_TIMER);
  if(count <= 1) return;
  LP_AUTOPLAY_TIMER = setInterval(() => slideLPMedia(1), 4000);
  let cont = document.getElementById('landingMedia');
  cont.onmouseenter = () => clearInterval(LP_AUTOPLAY_TIMER);
  cont.onmouseleave = () => { LP_AUTOPLAY_TIMER = setInterval(() => slideLPMedia(1), 4000); };
}

window.onSettingsLoaded = function(){ if(PROD.length) renderProductPage(); };
window.onProductsLoaded = function(){ renderProductPage(); };
window.onLangChange = function(){ renderProductPage(); };
window.onCartChange = function(){};

updateCartBadge();
renderCartDrawer();
updateLangDOM();
initApp();
</script>
