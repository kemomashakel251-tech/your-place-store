  </div>

<div id="socialIconsBar"></div>

<script src="shared.js"></script>
<script>
function renderShippingPolicyPage(){
  let hasPolicy = !!(SET.shippingPolicyText && SET.shippingPolicyText.trim());
  document.getElementById('shipPolicyText').innerText = hasPolicy ? SET.shippingPolicyText : '';
  document.getElementById('shipPolicyEmptyMsg').style.display = hasPolicy ? 'none' : 'block';
}

window.onSettingsLoaded = function(){ renderShippingPolicyPage(); };
window.onProductsLoaded = function(){};
window.onLangChange = function(){};
window.onCartChange = function(){};

updateCartBadge();
updateLangDOM();
initApp();
</script>
